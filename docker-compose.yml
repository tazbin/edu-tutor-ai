services:
  db:
    image: pgvector/pgvector:pg17
    container_name: edututor-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edututor_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edututor_ai}
      POSTGRES_DB: ${POSTGRES_DB:-edututor_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - edututor_ai_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edututor_ai_pgdata:
